name: Build and Release

on:
  workflow_dispatch: # 纯粹的手动点击触发

env:
  NODE_VERSION: 22.x
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # 🌟 改为 preview 环境
  BUILD_TYPE: preview
  EAS_PROFILE: preview

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      EAS_LOCAL_BUILD_SKIP_CLEANUP: 1

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm 

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
          packager: npm 

      - name: 📦 Install dependencies
        run: npm install 

      - name: ⚙️ Prepare Variables
        id: prepare-vars
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(git rev-list --count HEAD)

          # 🌟 因为你的 eas.json 写死了 arm64-v8a，所以这里直接固定架构名称
          APK_NAME="zhihu-minus-minus-v${APP_VERSION}-${{ env.BUILD_TYPE }}-arm64-v8a"
          ARTIFACT_DIR="${RUNNER_TEMP}/${APK_NAME}"

          mkdir -p "$ARTIFACT_DIR"

          echo "APK_TEMP_PATH=${ARTIFACT_DIR}/${APK_NAME}.apk" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

          echo "apkName=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "artifactDir=${ARTIFACT_DIR}" >> $GITHUB_OUTPUT

      - name: ⚙️ Prepare Firebase Config
        env:
          FIREBASE_ANDROID_JSON_B64: ${{ secrets.FIREBASE_ANDROID_JSON_B64 }}
        if: ${{ env.FIREBASE_ANDROID_JSON_B64 != '' }}
        run: |
          mkdir -p assets/config/google-services
          echo "$FIREBASE_ANDROID_JSON_B64" | base64 -d > assets/config/google-services/google-services.real.json

      - name: 🚀 Build APK
        # 使用 preview profile 执行打包
        run: eas build --platform android --profile ${{ env.EAS_PROFILE }} --local --no-wait --output="$APK_TEMP_PATH"

      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare-vars.outputs.apkName }}
          path: ${{ steps.prepare-vars.outputs.artifactDir }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: ⚙️ Prepare Release Variables
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${APP_VERSION}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          ls -R dist/

      - name: 🎁 Create Release
        run: |
          mapfile -t FILES < <(find dist -type f -name "*.apk" | sort)

          gh release create "$RELEASE_TAG" \
            "${FILES[@]}" \
            --title "$RELEASE_TAG" \
            --draft \
            --notes "auto release by GitHub Actions"
